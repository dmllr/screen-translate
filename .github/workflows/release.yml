name: Release

# Builds and publishes the app for tags vMAJOR.MINOR.REVISION or vMAJOR.MINOR.REVISION.BUILD.
# The tag must match the VERSION file (BUILD is compared only when the tag has it).
# CI never modifies VERSION (Gradle skips the BUILD bump when CI=true).
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:   # manual dry run: builds and uploads artifacts, no GitHub release

permissions:
  contents: write

env:
  NDK_VERSION: 29.0.14206865
  CMAKE_VERSION: 4.1.2

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: src/screen-translate-android
    steps:
      - uses: actions/checkout@v4

      - name: Read VERSION and check the tag
        id: version
        working-directory: .
        run: |
          get() { sed -n "s/^[[:space:]]*$1[[:space:]]*=[[:space:]]*\([0-9]\+\).*/\1/p" VERSION; }
          name="$(get MAJOR).$(get MINOR).$(get REVISION).$(get BUILD)"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "VERSION: $name"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            case "$name" in
              "$tag"|"$tag".*) echo "Tag v$tag matches VERSION" ;;
              *) echo "::error::Tag v$tag does not match VERSION ($name)"; exit 1 ;;
            esac
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25   # gradle/gradle-daemon-jvm.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION"

      # Pinned third-party sources cloned by src/cmake/import_remote.cmake.
      - name: Cache native dependency sources
        uses: actions/cache@v4
        with:
          path: _imported
          key: imported-${{ hashFiles('src/cmake/**') }}

      # Optional release key. Without these secrets the APK is signed with the debug key.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: .
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No KEYSTORE_BASE64 secret: signing with the debug key"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.config

      - name: Build release APK and bundle
        run: ./gradlew --stacktrace :app:assembleRelease :app:bundleRelease

      - name: Collect artifacts
        id: dist
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          v="${{ steps.version.outputs.name }}"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/screen-translate-$v.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/dist/screen-translate-$v.aab"
          cp app/build/outputs/mapping/release/mapping.txt "$GITHUB_WORKSPACE/dist/screen-translate-$v-mapping.txt"
          (cd "$GITHUB_WORKSPACE/dist" && sha256sum * > SHA256SUMS)
          ls -l "$GITHUB_WORKSPACE/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: screen-translate-${{ steps.version.outputs.name }}
          path: dist/

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Screen Translate ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*

      - name: Remove signing material
        if: always()
        working-directory: .
        run: rm -f keystore.config "$RUNNER_TEMP/release.jks"
